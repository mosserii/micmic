       including the inner translate/scale that already exists in that file to
       turn its Illustrator-exported coordinates into ordinary SVG units), just
       wrapped in one outer <g transform> that maps that geometry into this
       24x24 box. The outer transform was solved so the mark's own getBBox()
       lands at x=4 y=2.61 w=16 h=18.79, same x/width as the generic mic
       glyph this replaces (x=4 w=16), similar height (18.79 vs 20), so every
       color/opacity/animation rule on .orb .core keeps working unchanged. Kept
       at full detail (not simplified): it stays legible down to the 16px
       .ob-mcore/.ob-ocore onboarding glyphs since it is a vector path, not a
       raster asset. Source of truth for savta/web/index.html's #core svg and
       savta/web/onboarding/onboarding.js's SVG.mic, which embed this markup
       inline and are kept in sync with this file by hand. -->
