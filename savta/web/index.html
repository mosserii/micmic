  try{ chosen = localStorage.getItem("micmic.lang"); }catch(_){}
  buildLangMenu();
  applyLanguage(LANGS.some(l => l.code === chosen) ? chosen : LANG, {remember:false});
  // The bar has no typing box to focus, and by the time this fetch resolves native may
  // already have painted "listening"; an idle painted over it here would wipe that.
  if(!BAR){
    showTyping(true);
    setState("idle", MODE === "wake" ? "wake" : "idle");
  }
  start();
  // A Mac nobody has been set up on: three short screens in the app's own window
  // (web/onboarding/). Fetched only here, so every other launch pays nothing for it.
  if(PANEL && CFG.first_run){
    const ob = document.createElement("script");
    ob.src = "/onboarding/onboarding.js";
    document.head.appendChild(ob);
  }
})();

/* ---------------------------------------------------------------- panel bridge
   MicMic.app drives these from listener.py so the orb in its window shows what the
   native listener is doing. Without them the panel would sit at "touch to speak"
   while the wake word was busy — the exact blindness the window exists to remove. */
if(PANEL){
  document.body.classList.add("panel");
  window.panelState = (state, text) => {
    setState(["idle","listening","thinking","acting","error"].includes(state) ? state : "idle");
    if(text) $("state").textContent = text;
  };
  window.panelHeard = t => {
    $("heard").textContent = t || "";
    $("heard").classList.remove("fade");
    $("reply").textContent = "";
  };
  window.panelReply = t => { $("reply").textContent = t || ""; };
}

/* ---------------------------------------------------------------- bar bridge
   native/bar.py drives these. The contract is deliberately small, because the listener
   calls it from the middle of recognition: barState(state, text), barHeard(text) many
   times a second, barResult(say, undoLabel). The page talks back through the
   "micmicbar" message handler with "dismiss", "height:<px>" and "touch" (she did
   something here, so do not fade out from under her). */
function paintBarCopy(){
  if(!BAR) return;
  const u = $("undo");
  if(!u.hidden && !u.disabled) $("undow").textContent = BAR_UNDO_LABEL || t("undo");
}
let BAR_UNDO_LABEL = null;
if(BAR){
  const root = document.documentElement;
  root.classList.add("barmode");
  const post = m => {
    try{ window.webkit.messageHandlers.micmicbar.postMessage(m); }catch(_){}
  };
  const stage = document.querySelector(".stage");
  let lastH = 0;
  const report = () => {
    const h = Math.ceil(stage.getBoundingClientRect().height);
    if(h > 0 && h !== lastH){ lastH = h; post("height:" + h); }
  };
  new ResizeObserver(report).observe(stage);

  const flags = () => {
    root.classList.toggle("b-heard", !!$("heard").textContent);
    root.classList.toggle("b-result", !!$("reply").textContent);
  };
  const clearTurn = () => {
    if(typeof stopWork === "function") stopWork();
    $("heard").textContent = ""; $("reply").textContent = "";
    root.classList.remove("b-err", "b-undofail");
    $("undo").hidden = true; $("undo").disabled = false;
    BAR_UNDO_LABEL = null;
  };

  let WORK_T0 = 0, WORK_TIMER = null;
  const paintWork = () => {
    const sec = Math.round((Date.now() - WORK_T0) / 1000);
    $("work").textContent = t("working") + (sec >= 3 ? ` · ${sec}s` : "");
    $("work").dataset.long = sec >= 3 ? "1" : "";
  };
  const stopWork = () => { clearInterval(WORK_TIMER); WORK_TIMER = null; $("work").textContent = ""; };

  window.barState = (state, text) => {
    const s = ["idle","listening","thinking","acting","error"].includes(state) ? state : "idle";
    if(s === "thinking"){
      if(!WORK_TIMER){ WORK_T0 = Date.now(); paintWork(); WORK_TIMER = setInterval(paintWork, 500); }
    } else stopWork();
    // "listening" and "idle" begin a new turn (or end all of them). Whatever the last
    // one said must not still be on screen while she says the next thing.
    if(s === "listening" || s === "idle") clearTurn();
    const key = {listening:"ready", thinking:"think", acting:"acting"}[s];
    setState(s, key);
    if(s === "idle"){ STATE_KEY = null; $("state").textContent = ""; }
    if(text){ STATE_KEY = null; $("state").textContent = text; }
    if(s === "error"){
      // Broken must read as broken: the reason goes where the answer would have been,
      // in the error colour, not as a quiet placeholder.
      $("reply").textContent = text || t("neterr");
      root.classList.add("b-err");
      $("undo").hidden = true;
    } else {
      root.classList.remove("b-err");
    }
    flags();
  };

  window.barHeard = text => {
    text = String(text || "");
    if(text === $("heard").textContent) return;     // the recogniser repeats itself
    // New words while an answer is up mean she has started the next request, so the
    // orb goes back to listening too: "acting" from the last answer outlived it.
    if($("reply").textContent){ clearTurn(); setState("listening", "ready"); }
    $("heard").textContent = text;
    flags();
    // Measured once a frame, not once a call: the recogniser can call this hundreds
    // of times a second and each measurement forces a layout.
    if(!overPending){
      overPending = true;
      requestAnimationFrame(() => {
        overPending = false;
        const h = $("heard"), n = h.firstChild;
        let over = false;
        if(n){ const r = document.createRange(); r.selectNodeContents(h);
               over = r.getBoundingClientRect().height > h.clientHeight + 1; }
        h.classList.toggle("over", over);
      });
    }
  };
  let overPending = false;

  window.barResult = (say, undoLabel) => {
    stopWork();
    $("reply").textContent = String(say || "");
    root.classList.remove("b-err", "b-undofail");
    const u = $("undo");
    if(undoLabel === null || undoLabel === undefined){
      BAR_UNDO_LABEL = null; u.hidden = true;
    } else {
      // An empty label still means "this can be undone"; it just gets the plain word.
      BAR_UNDO_LABEL = String(undoLabel) || null;
      u.disabled = false; u.hidden = false;
      $("undow").textContent = BAR_UNDO_LABEL || t("undo");
    }
    setState("acting");
    flags();
  };

  // Undo is the page's own job: native only shows the button. The server contract is
  // POST /api/undo -> {undone, did, say}. Anything short of undone === true is shown
  // as not done, because telling her something was reversed when it was not is worse
  // than no Undo button at all.
  async function barUndo(){
    const u = $("undo");
    if(u.hidden || u.disabled) return;
    u.disabled = true;                       // one press, one undo
    $("undow").textContent = t("undoing");
    post("touch");
    let line = "", ok = false, r = null;
    try{
      r = await fetch("/api/undo", {method:"POST",
        headers:{"Content-Type":"application/json"}, body:"{}"});
    }catch(_){
      line = t("undoNet");                   // never reached the server at all
    }
    if(r){
      if(r.status === 404) line = t("undoNone");
      else if(!r.ok) line = t("undoFailed");
      else{
        // The server answered but not in the contract's shape: it may or may not have
        // done something, and "couldn't undo" is the claim that is safe to make.
        let d = null;
        try{ d = await r.json(); }catch(_){}
        ok = !!d && d.undone === true;
        line = (d && typeof d.say === "string" && d.say.trim()) ? d.say
             : (ok ? t("undone") : t("undoFailed"));
      }
    }
    u.hidden = true;
    $("reply").textContent = line;
    root.classList.toggle("b-undofail", !ok);
    flags();
    post("touch");
  }
  $("undo").addEventListener("click", e => { e.stopPropagation(); barUndo(); });

  addEventListener("keydown", e => {
    if(e.key === "Escape"){ e.preventDefault(); post("dismiss"); return; }
    // The shortcut every Mac user already has in their fingers for "take that back".
    if((e.metaKey || e.ctrlKey) && !e.altKey && e.code === "KeyZ" && !$("undo").hidden){
      e.preventDefault(); barUndo();
    }
  });
  // The panel's language menu writes this; the bar is a separate page in the same
  // origin and would otherwise keep the old language until it next reloaded.
  addEventListener("storage", e => {
    if(e.key === "micmic.lang" && e.newValue) applyLanguage(e.newValue, {remember:false});
  });
  setState("idle");
  flags();
}
</script>
</body>
</html>
